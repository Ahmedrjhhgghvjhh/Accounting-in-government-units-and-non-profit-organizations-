    // ============================================================
    // باقي الكود شغال تلقائي - متغيرش حاجة تحت دي
    // ============================================================
    
    let allQuestions = [];

    function buildExam() {
        const root = document.getElementById('quizRoot');
        root.innerHTML = '';
        allQuestions = [];

        // قسم صح وخطأ
        const tfSection = document.createElement('div');
        tfSection.className = 'section-card';
        tfSection.innerHTML = '<div class="section-title">📌 الجزء الأول: أسئلة صح (✓) وخطأ (✗)</div>';
        tfQuestions.forEach((q, idx) => {
            const qId = `tf_${idx}`;
            const questionDiv = document.createElement('div');
            questionDiv.className = 'question-item';
            questionDiv.innerHTML = `
                <div class="question-text">${idx+1}. ${q.text}</div>
                <div class="truefalse-options">
                    <label><input type="radio" name="${qId}" value="صح"> صح</label>
                    <label><input type="radio" name="${qId}" value="خطأ"> خطأ</label>
                </div>
                <div class="feedback" id="fb_${qId}"></div>
            `;
            tfSection.appendChild(questionDiv);
            allQuestions.push({ type: 'tf', id: qId, correct: q.correct, element: questionDiv });
        });
        root.appendChild(tfSection);

        // قسم اختيار من متعدد
        const mcSection = document.createElement('div');
        mcSection.className = 'section-card';
        mcSection.innerHTML = '<div class="section-title">🔢 الجزء الثاني: أسئلة الاختيار من متعدد (الحالات العملية)</div>';
        mcQuestions.forEach((mc, idx) => {
            const qId = `mc_${idx}`;
            const qDiv = document.createElement('div');
            qDiv.className = 'question-item';
            let optionsHtml = `<div class="question-text">${idx+1 + tfQuestions.length}. ${mc.text}</div><div class="mc-options">`;
            mc.options.forEach((opt, optIdx) => {
                const letter = String.fromCharCode(97+optIdx);
                optionsHtml += `<label class="mc-option"><input type="radio" name="${qId}" value="${letter}"> ${opt}</label>`;
            });
            optionsHtml += `</div><div class="feedback" id="fb_${qId}"></div>`;
            qDiv.innerHTML = optionsHtml;
            mcSection.appendChild(qDiv);
            allQuestions.push({ type: 'mc', id: qId, correct: mc.correct, element: qDiv });
        });
        root.appendChild(mcSection);
    }

    function getSelectedValue(name) {
        const radios = document.querySelectorAll(`input[name="${name}"]`);
        for (let r of radios) {
            if (r.checked) return r.value;
        }
        return null;
    }

    function attachEvents() {
        document.getElementById('checkAllBtn').onclick = () => {
            let correctCount = 0;
            allQuestions.forEach(q => {
                const selected = getSelectedValue(q.id);
                const feedbackDiv = q.element.querySelector('.feedback');
                let isCorrect = false;
                if (selected) {
                    if (q.type === 'tf') isCorrect = (selected === q.correct);
                    else isCorrect = (selected === q.correct);
                }
                if (isCorrect) {
                    correctCount++;
                    feedbackDiv.innerHTML = '✔️ إجابة صحيحة.';
                    feedbackDiv.className = 'feedback correct';
                } else {
                    let correctAnswerText = '';
                    if (q.type === 'tf') {
                        correctAnswerText = (q.correct === 'صح' ? 'صح' : 'خطأ');
                    } else {
                        correctAnswerText = `الخيار الصحيح: ${q.correct.toUpperCase()}`;
                    }
                    feedbackDiv.innerHTML = `❌ غير صحيحة. ${correctAnswerText}`;
                    feedbackDiv.className = 'feedback wrong';
                }
            });
            document.getElementById('scoreValue').innerText = `${correctCount} / ${allQuestions.length}`;
        };

        document.getElementById('resetAllBtn').onclick = () => {
            allQuestions.forEach(q => {
                const radios = q.element.querySelectorAll(`input[name="${q.id}"]`);
                radios.forEach(r => r.checked = false);
                const fb = q.element.querySelector('.feedback');
                fb.innerHTML = '';
                fb.className = 'feedback';
            });
            document.getElementById('scoreValue').innerText = `0 / ${allQuestions.length}`;
        };
    }

    buildExam();
    attachEvents();
    document.getElementById('scoreValue').innerText = `0 / ${allQuestions.length}`;
</script>
